################################################################################
# Terminal
################################################################################

# Keeps 50 MiB of scrollback history per terminal surface.
# Memory is allocated progressively as needed.
scrollback-limit = 52428800

# Uses standard macOS behavior: selecting text does not copy it.
# Copy and paste remain explicit with Cmd+C and Cmd+V.
copy-on-select = false

# Hides the mouse pointer while typing.
mouse-hide-while-typing = true

# Improves compatibility with remote hosts without modifying them.
# SSH sessions use xterm-256color instead of requiring Ghostty terminfo.
shell-integration-features = ssh-env
