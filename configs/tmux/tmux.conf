# tmux
################################################################################

source-file ~/.config/tmux/conf.d/10-server.conf
source-file ~/.config/tmux/conf.d/20-terminal.conf
source-file ~/.config/tmux/conf.d/30-input.conf
source-file ~/.config/tmux/conf.d/40-windows.conf
source-file ~/.config/tmux/conf.d/50-status.conf
