# Repository root used by reload and TPM. current_file is this module.
set-option -gqF @dotfiles_config_root "#{d:current_file}/.."

# Keep enough history for long operational output without unbounded memory use.
set-option -g history-limit 100000
set-option -s buffer-limit 50

# Use human-friendly indexes and close gaps after windows are removed.
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Preserve detached sessions, but exit when the final session disappears.
set-option -g destroy-unattached off
set-option -s exit-empty on

# Move clients to another session when the current session is destroyed.
set-option -g detach-on-destroy off

# Keep failed commands visible for troubleshooting; successful panes close.
set-window-option -g remain-on-exit failed

# Name windows after the active command. A manual rename disables this per window.
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format "#{pane_current_command}"
set-window-option -g allow-rename off
