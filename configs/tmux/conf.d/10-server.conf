################################################################################
# Server
################################################################################

# Reduces the delay after Esc.
# Especially useful in Vim: Esc returns immediately to Normal mode.
set -s escape-time 10

# Keeps up to 10,000 lines of history per pane.
# The value applies to new panes and does not change existing ones.
set -g history-limit 10000

# Forwards terminal focus events to applications.
# Vim can detect when the terminal loses or regains focus.
set -g focus-events on

# Closes the tmux server when no sessions remain.
# This is already the default behavior, but it is made explicit here.
set -s exit-empty on

# Keeps the server running when the last client disconnects.
# Sessions continue to exist after an SSH disconnect or detach.
set -s exit-unattached off
