# Keep enough scrollback for long-running remote commands.
set-option -g history-limit 100000

# Use human-friendly indexes and close numbering gaps automatically.
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Preserve the server and move to another session when one is destroyed.
set-option -g exit-empty off
set-option -g detach-on-destroy off

# Keep failed commands visible for inspection.
set-window-option -g remain-on-exit failed

# Let tmux name windows after their active command.
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format "#{pane_current_command}"
set-option -g allow-rename off

# Keep status information responsive without constant refreshes.
set-option -g status-interval 5

# Forward focus changes so applications such as Neovim can react.
set-option -g focus-events on

# Bound tmux's internal copy-buffer history.
set-option -g buffer-limit 50
