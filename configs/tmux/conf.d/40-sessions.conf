# Session selection and lifecycle remain behind the prefix.
bind-key s choose-tree -Zs
bind-key d detach-client
bind-key '$' command-prompt -I "#S" -p "rename session:" {
  rename-session "%%"
}

# Create or switch to a named session, starting in the active pane directory.
bind-key N command-prompt -p "new session:" {
  new-session -A -s "%%" -c "#{pane_current_path}"
}

# Destructive session removal always asks for confirmation.
bind-key X confirm-before -p "kill session #S? (y/n)" {
  kill-session
}
