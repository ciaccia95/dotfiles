# New windows inherit the active pane directory.
bind-key c new-window -c "#{pane_current_path}"

# Manual names remain stable because rename-window disables automatic rename
# for that window. Prefix+A restores automatic naming.
bind-key ',' command-prompt -I "#W" -p "rename window:" {
  rename-window "%%"
}
bind-key A set-window-option automatic-rename on \; \
  display-message "automatic window naming: ON"

# Fast, repeatable window navigation; Tab returns to the previous window.
bind-key -r n next-window
bind-key -r p previous-window
bind-key Tab last-window
bind-key w choose-tree -Zw

# Window removal remains explicit and confirmed.
bind-key '&' confirm-before -p "kill window #W? (y/n)" {
  kill-window
}
