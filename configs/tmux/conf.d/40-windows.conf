################################################################################
# Windows and panes
################################################################################

# Numbers windows starting at 1 instead of 0.
# This maps the first nine windows directly to the 1-9 keys.
set -g base-index 1

# Numbers panes starting at 1 as well.
setw -g pane-base-index 1

# Closes gaps in window numbering after a window is removed.
#
# Example:
#   before:  1 2 3 4
#   close 2
#   after:   1 2 3
set -g renumber-windows on

# Automatically updates the window name based on the active program,
# for example: vim, ssh or htop.
setw -g automatic-rename on

# Prevents applications from renaming the window through terminal control
# sequences. The name remains managed by tmux or is set manually with Prefix+,.
setw -g allow-rename off

# Closes a pane normally when its process exits.
# This is the native behavior, but it is made explicit here.
setw -g remain-on-exit off;
