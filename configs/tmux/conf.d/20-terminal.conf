# Prefer tmux-256color when its terminfo entry exists on this host.
# screen-256color is a conservative fallback for restricted remote systems.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set-option -g default-terminal tmux-256color' \
  'set-option -g default-terminal screen-256color'

# Declare capabilities provided by Ghostty, including its SSH TERM fallback.
# terminal-features is the modern tmux interface for capability classes.
set-option -s terminal-features[100] "xterm-ghostty:RGB,clipboard,focus,hyperlinks,usstyle"
set-option -s terminal-features[101] "xterm-256color:RGB,clipboard,focus,hyperlinks,usstyle"

# Forward terminal focus changes to applications such as Neovim.
set-option -g focus-events on

# Let the outer terminal show useful tmux context in its native title.
set-option -g set-titles on
set-option -g set-titles-string "tmux: #S:#I #W"

# Keep terminal passthrough disabled. OSC 52 is handled explicitly by tmux.
set-window-option -g allow-passthrough off
