# The base configuration is complete without plugins. This explicit TPM list is
# required because TPM cannot discover @plugin lines through format-expanded
# source-file paths used by the portable modular loader.
set-option -g @tpm_plugins "tmux-plugins/tpm tmux-plugins/tmux-resurrect tmux-plugins/tmux-continuum"

# Automatic restore and periodic saves complement tmux's native detached
# sessions; they cannot resurrect arbitrary process state.
set-option -g @continuum-restore "on"
set-option -g @continuum-save-interval "15"

# Keep plugin data beside the XDG tmux configuration.
set-environment -gF TMUX_PLUGIN_MANAGER_PATH "#{@dotfiles_config_root}/plugins/"

if-shell -b 'test -x "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"' \
  'run-shell "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"'
