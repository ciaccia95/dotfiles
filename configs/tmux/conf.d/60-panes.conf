# Intuitive split keys plus corrected default bindings. Every split inherits cwd.
bind-key '|' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"
bind-key '%' split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation stays behind the prefix to avoid stealing keys from
# shells, Neovim and other terminal applications.
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# Uppercase directions resize by five cells and may be repeated.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

bind-key z resize-pane -Z
bind-key q display-panes
bind-key x confirm-before -p "kill pane #P? (y/n)" {
  kill-pane
}

# Broadcast input is deliberately conspicuous in the status line.
bind-key S set-window-option synchronize-panes \; \
  display-message "synchronize panes: #{?pane_synchronized,ON,OFF}"
