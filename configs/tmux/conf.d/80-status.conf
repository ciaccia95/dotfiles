# A restrained ANSI-only interface. Ghostty remains the palette owner.
set-option -g status on
set-option -g status-position bottom
set-option -g status-interval 5
set-option -g status-justify left
set-option -g status-style "fg=white,bg=black"

# Session plus high-visibility operational state. No state relies on red/green.
set-option -g status-left-length 80
set-option -g status-left "#[fg=white,bg=black,bold] #S #[nobold]#{?client_prefix,#[fg=black#,bg=yellow#,bold] PREFIX #[fg=white#,bg=black#,nobold],}#{?pane_synchronized,#[fg=black#,bg=cyan#,bold] SYNC #[fg=white#,bg=black#,nobold],}#{?window_zoomed_flag,#[fg=black#,bg=white#,bold] ZOOM #[fg=white#,bg=black#,nobold],}"

# Hostname is useful over SSH; ISO-like date and 24-hour time are unambiguous.
set-option -g status-right-length 64
set-option -g status-right "#[fg=white,bg=black] #H | %Y-%m-%d %H:%M "

set-window-option -g window-status-separator " "
set-window-option -g window-status-format "#[fg=white,bg=black] #I:#W#F "
set-window-option -g window-status-current-format "#[fg=black,bg=white,bold] #I:#W#F "
set-window-option -g window-status-bell-style "fg=black,bg=yellow,bold"
set-window-option -g window-status-activity-style "reverse"

# Prompts, copy mode and pane indicators use text attributes plus ANSI contrast.
set-option -g message-style "fg=black,bg=yellow,bold"
set-option -g message-command-style "fg=yellow,bg=black,bold"
set-window-option -g mode-style "fg=black,bg=cyan,bold"
set-window-option -g pane-border-style "fg=white"
set-window-option -g pane-active-border-style "fg=cyan,bold"
set-option -g display-panes-colour white
set-option -g display-panes-active-colour cyan
