# Keep the standard prefix. C-b C-b still sends a literal C-b to the pane.
set-option -g prefix C-b
bind-key C-b send-prefix

# Responsive Escape handling for Vim and Neovim, with time for repeatable binds.
set-option -s escape-time 10
set-option -g repeat-time 500

# Vim-style command prompts and terminal-owned mouse selection.
set-option -g status-keys vi
set-option -g mouse off

# Reload the complete configuration from its resolved repository/XDG root.
bind-key r source-file -Fq "#{@dotfiles_config_root}/tmux.conf" \; \
  display-message "tmux configuration reloaded"
