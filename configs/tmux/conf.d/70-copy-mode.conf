# Normal pointer selection belongs to Ghostty, so Cmd+C and Cmd+V remain native.
# Full tmux history remains available through the keyboard copy mode.
set-window-option -g mode-keys vi
set-option -s set-clipboard external

# tmux 3.7+ can answer clipboard-read requests; deny them. -q keeps this file
# compatible with 3.3-3.6, where the option does not exist.
set-option -sq get-clipboard off

bind-key Enter copy-mode
bind-key '[' copy-mode
bind-key PPage copy-mode -u

# Vim-style selection. Copying stores text in tmux and sends OSC 52 outward.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# Explicit search bindings keep behavior stable across tmux defaults.
bind-key -T copy-mode-vi / command-prompt -T search -p "(search down)" {
  send-keys -X search-forward -- "%%"
}
bind-key -T copy-mode-vi '?' command-prompt -T search -p "(search up)" {
  send-keys -X search-backward -- "%%"
}
bind-key -T copy-mode-vi n send-keys -X search-again
bind-key -T copy-mode-vi N send-keys -X search-reverse

bind-key -T copy-mode-vi g send-keys -X history-top
bind-key -T copy-mode-vi G send-keys -X history-bottom
bind-key -T copy-mode-vi q send-keys -X cancel
