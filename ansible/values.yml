---
# Canonical defaults. Keep host-specific changes in values.local.yml.
dotfiles_defaults:
  deployment:
    source_root: "{{ playbook_dir }}/../../configs"
    xdg_config_home: null
    directory_mode: "0755"
    file_mode: "0644"

  linux:
    become: true
    packages:
      Debian:
        vim: vim
        tmux: tmux
      RedHat:
        vim: vim-enhanced
        tmux: tmux
      Suse:
        vim: vim
        tmux: tmux

  ghostty:
    executable: /Applications/Ghostty.app/Contents/MacOS/ghostty

  vim:
    executable: vim
    theme:
      repository: https://github.com/arcticicestudio/nord-vim.git
      version: f13f5dfbb784deddbc1d8195f34dfd9ec73e2295

  tmux:
    executable: tmux
    theme:
      repository: https://github.com/nordtheme/tmux.git
      version: f7b6da07ab55fe32ee5f7d62da56d8e5ac691a92

  lazygit:
    executable: lazygit
...
