---
- name: Require a macOS target
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == "Darwin"
    fail_msg: "Ghostty is supported only on macOS targets."

- name: Ensure Ghostty is installed
  ansible.builtin.command:
    argv:
      - "{{ ghostty_executable }}"
      - --version
  changed_when: false

- name: Verify Ghostty source files
  ansible.builtin.stat:
    path: "{{ ghostty_source_directory }}/{{ item }}"
  delegate_to: localhost
  become: false
  register: ghostty_source_file
  failed_when:
    - not ghostty_source_file.stat.exists
      or not ghostty_source_file.stat.isreg
  loop: "{{ ghostty_configuration_files }}"
  loop_control:
    label: "{{ item }}"

- name: Ensure the XDG configuration root exists
  ansible.builtin.file:
    path: "{{ dotfiles_xdg_config_home }}"
    state: directory
    mode: "{{ dotfiles_values.deployment.directory_mode }}"

- name: Inspect existing Ghostty configuration
  ansible.builtin.stat:
    path: "{{ ghostty_destination_directory }}"
    follow: false
  register: ghostty_destination

- name: Refuse to replace an unmanaged Ghostty symlink
  ansible.builtin.assert:
    that:
      - not ghostty_destination.stat.islnk | default(false)
    fail_msg: >-
      {{ ghostty_destination_directory }} is a symbolic link.
      Replace it explicitly before allowing Ansible to manage this directory.

- name: Ensure Ghostty directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "{{ dotfiles_values.deployment.directory_mode }}"
  loop:
    - "{{ ghostty_destination_directory }}"
    - "{{ ghostty_destination_directory }}/conf.d"

- name: Deploy Ghostty configuration
  ansible.builtin.copy:
    src: "{{ ghostty_source_directory }}/"
    dest: "{{ ghostty_destination_directory }}/"
    mode: preserve
    directory_mode: "{{ dotfiles_values.deployment.directory_mode }}"
  notify: Validate Ghostty configuration
...
