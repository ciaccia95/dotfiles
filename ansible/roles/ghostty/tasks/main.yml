---
- name: Ensure Ghostty is installed
  ansible.builtin.command:
    argv:
      - "{{ ghostty_executable }}"
      - --version
  changed_when: false

- name: Verify Ghostty source configuration
  ansible.builtin.stat:
    path: "{{ ghostty_source_directory }}/config"
  register: ghostty_source_config
  failed_when:
    - not ghostty_source_config.stat.exists
      or not ghostty_source_config.stat.isreg

- name: Inspect existing Ghostty configuration
  ansible.builtin.stat:
    path: "{{ ghostty_destination_directory }}"
    follow: false
  register: ghostty_destination

- name: Refuse to replace an unmanaged Ghostty symlink
  ansible.builtin.assert:
    that:
      - >
        not ghostty_destination.stat.islnk | default(false)
        or (ghostty_destination.stat.lnk_source | realpath)
        == (ghostty_source_directory | realpath)
    fail_msg: >-
      {{ ghostty_destination_directory }} is a symlink to an unmanaged target.
      Review it before running the playbook again.

- name: Remove managed Ghostty configuration symlink
  ansible.builtin.file:
    path: "{{ ghostty_destination_directory }}"
    state: absent
  when: ghostty_destination.stat.islnk | default(false)

- name: Ensure Ghostty configuration directory exists
  ansible.builtin.file:
    path: "{{ ghostty_destination_directory }}"
    state: directory
    mode: "0755"

- name: Deploy Ghostty configuration
  ansible.builtin.copy:
    src: "{{ ghostty_source_directory }}/"
    dest: "{{ ghostty_destination_directory }}/"
    mode: preserve
    directory_mode: "0755"
  notify: Validate Ghostty configuration
