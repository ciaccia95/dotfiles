---
- name: Check whether Neovim is installed
  ansible.builtin.command:
    argv:
      - "{{ nvim_executable }}"
      - --version
  register: nvim_version
  check_mode: false
  changed_when: false
  failed_when: false

- name: Require Neovim
  ansible.builtin.assert:
    that:
      - nvim_version.rc == 0
    fail_msg: >-
      Neovim is not installed or is not executable as {{ nvim_executable }}.
      Linux package installation is handled by the linux_packages role.
      On non-Linux systems, install Neovim explicitly before running this role.

- name: Read installed Neovim version
  ansible.builtin.set_fact:
    nvim_installed_version: >-
      {{
        nvim_version.stdout_lines[0]
        | regex_search('[0-9]+[.][0-9]+[.][0-9]+')
      }}

- name: Require a supported Neovim version
  ansible.builtin.assert:
    that:
      - nvim_installed_version is version(nvim_minimum_version, '>=')
    fail_msg: >-
      Neovim {{ nvim_installed_version }} is too old; this configuration
      requires {{ nvim_minimum_version }} or newer.

- name: Verify Neovim source configuration
  ansible.builtin.stat:
    path: "{{ nvim_source_directory }}/init.lua"
  delegate_to: localhost
  become: false
  register: nvim_source_config
  failed_when:
    - not nvim_source_config.stat.exists
      or not nvim_source_config.stat.isreg

- name: Inspect existing Neovim configuration
  ansible.builtin.stat:
    path: "{{ nvim_destination_directory }}"
    follow: false
  register: nvim_destination

- name: Refuse to replace an unmanaged Neovim symlink
  ansible.builtin.assert:
    that:
      - not nvim_destination.stat.islnk | default(false)
    fail_msg: >-
      {{ nvim_destination_directory }} is a symbolic link.
      Replace it explicitly before allowing Ansible to manage this directory.

- name: Remove legacy nested Neovim configuration
  ansible.builtin.file:
    path: "{{ nvim_destination_directory }}/.config"
    state: absent

- name: Ensure Neovim configuration directory exists
  ansible.builtin.file:
    path: "{{ nvim_destination_directory }}"
    state: directory
    mode: "{{ dotfiles_values.deployment.directory_mode }}"

- name: Deploy Neovim configuration
  ansible.builtin.copy:
    src: "{{ nvim_source_directory }}/"
    dest: "{{ nvim_destination_directory }}/"
    mode: preserve
    directory_mode: "{{ dotfiles_values.deployment.directory_mode }}"
  notify: Validate Neovim configuration
