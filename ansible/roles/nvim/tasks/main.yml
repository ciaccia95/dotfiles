---
- name: Ensure Neovim is installed
  ansible.builtin.command:
    argv:
      - "{{ nvim_executable }}"
      - --version
  register: nvim_version
  changed_when: false
  failed_when: nvim_version.rc != 0

- name: Verify Neovim source configuration
  ansible.builtin.stat:
    path: "{{ nvim_source_directory }}/init.lua"
  delegate_to: localhost
  become: false
  register: nvim_source_config
  failed_when:
    - not nvim_source_config.stat.exists
      or not nvim_source_config.stat.isreg

- name: Inspect existing Neovim configuration
  ansible.builtin.stat:
    path: "{{ nvim_destination_directory }}"
    follow: false
  register: nvim_destination

- name: Refuse to replace an unmanaged Neovim symlink
  ansible.builtin.assert:
    that:
      - not nvim_destination.stat.islnk | default(false)
    fail_msg: >-
      {{ nvim_destination_directory }} is a symbolic link.
      Replace it explicitly before allowing Ansible to manage this directory.

- name: Remove legacy nested Neovim configuration
  ansible.builtin.file:
    path: "{{ nvim_destination_directory }}/.config"
    state: absent

- name: Ensure Neovim configuration directory exists
  ansible.builtin.file:
    path: "{{ nvim_destination_directory }}"
    state: directory
    mode: "{{ dotfiles_values.deployment.directory_mode }}"

- name: Deploy Neovim configuration
  ansible.builtin.copy:
    src: "{{ nvim_source_directory }}/"
    dest: "{{ nvim_destination_directory }}/"
    mode: preserve
    directory_mode: "{{ dotfiles_values.deployment.directory_mode }}"
  notify: Validate Neovim configuration
