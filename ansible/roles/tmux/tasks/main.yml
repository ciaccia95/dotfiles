---
- name: Check whether tmux is installed
  ansible.builtin.command:
    argv:
      - "{{ tmux_executable }}"
      - -V
  register: tmux_version
  check_mode: false
  changed_when: false
  failed_when: false

- name: Require tmux
  ansible.builtin.assert:
    that:
      - tmux_version.rc == 0
    fail_msg: >-
      tmux is not installed or is not executable as {{ tmux_executable }}.
      Linux package installation is handled by the linux_packages role.
      On macOS, install tmux explicitly before running this role.

- name: Verify tmux source files
  ansible.builtin.stat:
    path: "{{ tmux_source_directory }}/{{ item }}"
  delegate_to: localhost
  become: false
  register: tmux_source_file
  failed_when:
    - not tmux_source_file.stat.exists
      or not tmux_source_file.stat.isreg
  loop: "{{ tmux_configuration_files }}"
  loop_control:
    label: "{{ item }}"

- name: Inspect existing tmux configuration
  ansible.builtin.stat:
    path: "{{ tmux_destination_directory }}"
    follow: false
  register: tmux_destination

- name: Refuse to replace an unmanaged tmux symlink
  ansible.builtin.assert:
    that:
      - not tmux_destination.stat.islnk | default(false)
    fail_msg: >-
      {{ tmux_destination_directory }} is a symbolic link.
      Replace it explicitly before allowing Ansible to manage this directory.

- name: Ensure tmux configuration directory exists
  ansible.builtin.file:
    path: "{{ tmux_destination_directory }}"
    state: directory
    mode: "{{ dotfiles_values.deployment.directory_mode }}"

- name: Remove obsolete tmux configuration files
  ansible.builtin.file:
    path: "{{ tmux_destination_directory }}/{{ item }}"
    state: absent
  loop: "{{ tmux_obsolete_files }}"

- name: Deploy tmux configuration
  ansible.builtin.copy:
    src: "{{ tmux_source_directory }}/"
    dest: "{{ tmux_destination_directory }}/"
    mode: preserve
    directory_mode: "{{ dotfiles_values.deployment.directory_mode }}"
  notify: Validate tmux configuration
