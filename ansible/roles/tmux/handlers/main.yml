---
- name: Validate tmux configuration
  ansible.builtin.command:
    argv:
      - "{{ tmux_executable }}"
      - -L
      - dotfiles-validation
      - -f
      - "{{ tmux_destination_directory }}/tmux.conf"
      - start-server
      - ";"
      - kill-server
  environment:
    XDG_CONFIG_HOME: "{{ dotfiles_xdg_config_home }}"
  changed_when: false
