---
- name: Check whether Vim is installed
  ansible.builtin.command:
    argv:
      - "{{ vim_executable }}"
      - --version
  register: vim_version
  check_mode: false
  changed_when: false
  failed_when: false

- name: Require Vim
  ansible.builtin.assert:
    that:
      - vim_version.rc == 0
    fail_msg: >-
      Vim is not installed or is not executable as {{ vim_executable }}.
      Linux package installation is handled by the linux_packages role.
      On macOS, use the system Vim or install Vim explicitly.

- name: Record the Vim version
  ansible.builtin.set_fact:
    vim_detected_version: >-
      {{
        (
          vim_version.stdout
          | regex_findall('VIM - Vi IMproved ([0-9]+[.][0-9]+)')
          | first
        )
        | default('0.0')
      }}
  changed_when: false

- name: Require native Vim XDG support
  ansible.builtin.assert:
    that:
      - vim_detected_version is version(vim_minimum_version, '>=')
    fail_msg: >-
      Vim {{ vim_detected_version }} is too old for native XDG vimrc discovery.
      Install Vim {{ vim_minimum_version }} or newer before deploying this role.

- name: Verify Vim source files
  ansible.builtin.stat:
    path: "{{ vim_source_directory }}/{{ item }}"
  delegate_to: localhost
  become: false
  register: vim_source_file
  failed_when:
    - not vim_source_file.stat.exists
      or not vim_source_file.stat.isreg
  loop: "{{ vim_configuration_files }}"
  loop_control:
    label: "{{ item }}"

- name: Inspect legacy Vim configuration
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  register: vim_legacy_config
  loop: "{{ vim_legacy_configuration_files }}"
  loop_control:
    label: "{{ item }}"

- name: Require Vim configuration to live only in XDG
  ansible.builtin.assert:
    that:
      - not item.stat.exists
      - not item.stat.islnk | default(false)
    fail_msg: >-
      Legacy Vim configuration exists at {{ item.item }} and takes precedence
      over {{ vim_destination_directory }}/vimrc. Move it explicitly before
      allowing Ansible to manage the XDG-only configuration.
  loop: "{{ vim_legacy_config.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect existing Vim XDG configuration
  ansible.builtin.stat:
    path: "{{ vim_destination_directory }}"
    follow: false
  register: vim_destination

- name: Refuse to replace an unmanaged Vim symlink
  ansible.builtin.assert:
    that:
      - not vim_destination.stat.islnk | default(false)
    fail_msg: >-
      {{ vim_destination_directory }} is a symbolic link.
      Replace it explicitly before allowing Ansible to manage this directory.

- name: Ensure Vim directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ vim_destination_directory }}"
      mode: "{{ dotfiles_values.deployment.directory_mode }}"
    - path: "{{ vim_destination_directory }}/config"
      mode: "{{ dotfiles_values.deployment.directory_mode }}"
    - path: "{{ vim_destination_directory }}/pack/themes/start"
      mode: "{{ dotfiles_values.deployment.directory_mode }}"
  loop_control:
    label: "{{ item.path }}"

- name: Deploy Vim configuration
  ansible.builtin.copy:
    src: "{{ vim_source_directory }}/"
    dest: "{{ vim_destination_directory }}/"
    mode: preserve
    directory_mode: "{{ dotfiles_values.deployment.directory_mode }}"
  notify: Validate Vim configuration

- name: Install the pinned Nord Vim theme
  ansible.builtin.git:
    repo: "{{ vim_theme_repository }}"
    dest: "{{ vim_theme_directory }}"
    version: "{{ vim_theme_version }}"
    update: true
  notify: Validate Vim configuration
...
