################################################################################
# Server
################################################################################

# Mantiene una cronologia ampia per ogni pane.
# Utile soprattutto nelle sessioni SSH e nei comandi con output esteso.
set-option -g history-limit 100000

# Numera finestre e pane partendo da 1.
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Elimina i vuoti nella numerazione dopo la chiusura di una finestra.
set-option -g renumber-windows on

# Mantiene attivo il server tmux anche quando non ci sono sessioni.
set-option -g exit-empty off

# Se la sessione corrente viene distrutta, passa a un'altra sessione
# invece di scollegare immediatamente il client.
set-option -g detach-on-destroy off

# Mantiene aperto un pane quando il processo al suo interno termina.
# Il pane mostra il codice di uscita e può essere riavviato manualmente.
set-window-option -g remain-on-exit failed

# Aggiorna automaticamente il titolo della finestra in base
# all'applicazione attualmente in esecuzione.
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format "#{pane_current_command}"

# Impedisce alle applicazioni di modificare autonomamente
# il nome della finestra tramite sequenze del terminale.
set-option -g allow-rename off

# Controlla più frequentemente attività e cambiamenti nei pane.
set-option -g status-interval 5

# Trasmette gli eventi di focus alle applicazioni eseguite nei pane.
# Neovim può così rilevare quando il terminale perde o riacquista il focus.
set-option -g focus-events on

# Mantiene una quantità ragionevole di buffer di copia interni.
set-option -g buffer-limit 50
