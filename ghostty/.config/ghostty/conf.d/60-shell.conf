################################################################################
# Shell integration
################################################################################

# Let Ghostty detect and launch the user's configured login shell.
#
# Do not hardcode a shell path here. Ghostty resolves the default shell from
# the SHELL environment variable or from the current user's account settings.
# command = /bin/zsh

# Automatically detect the active shell and inject Ghostty's integration.
#
# Shell integration enables:
#
# - working-directory inheritance for new tabs and splits
# - prompt boundaries used by terminal navigation
# - safer close confirmation when the shell is idle
# - improved rendering when resizing complex prompts
shell-integration = detect

################################################################################
# Integration features
################################################################################

# Preserve Ghostty's default shell-integration features.
#
# Features should be enabled or disabled explicitly only when required.
# Available options include:
#
# - cursor
# - sudo
# - title
# - ssh-env
# - ssh-terminfo
# - path
#
# Example:
#
# 	shell-integration-features = no-cursor
#
# The default behavior is currently preferred.
# shell-integration-features =

################################################################################
# Environment
################################################################################

# Environment variables belong to the shell configuration unless they are
# specifically required by every process launched inside Ghostty.
#
# Avoid defining PATH, EDITOR or tool-specific variables here. They will be
# managed later through the shell dotfiles.
#
# Example:
#
# 	env = KEY=value
