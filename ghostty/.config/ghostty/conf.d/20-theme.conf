################################################################################
# Theme and accessibility
################################################################################

# Use the built-in Nightfox theme without color overrides.
#
# Nightfox provides a dark blue background, neutral foreground and clearly
# separated ANSI colors. In particular, the current shell renders directories
# in cyan, symbolic links in magenta and regular files in the foreground color.
#
# Background, foreground, palette, cursor, selection and contrast behavior are
# all owned by the theme. Do not override individual colors here.
theme = Nightfox

################################################################################
# Accessibility principles
################################################################################

# The terminal theme must not use red and green as the only way to communicate
# state. Applications running inside Ghostty should also use:
#
# - symbols
# - labels
# - text attributes
# - explicit status names
#
# Examples:
#
# 	[OK]		instead of green text only
# 	[ERROR]		instead of red text only
# 	+ / -		in diffs in addition to color
#
# Application-specific palettes for Neovim, tmux and lazygit will be configured
# separately using the same principle.
