################################################################################
# Theme and accessibility
################################################################################

# Use the highest-contrast Everforest dark variant available.
#
# The "Hard" variant provides a darker background and stronger separation
# between foreground elemets than the Medium and Soft variants.
theme = Everforest Dark Hard

################################################################################
# Contrast enforcement
################################################################################

# Enforce a minimum contrast ratio between text and the background.
#
# This reduce the risk of low-intensity ANSI colors becoming unreadable,
# especially red and green tones that are difficult to distinguish.
#
# 4.5 corresponds to the WCAG AA contrast target for normal text and is a
# reasonable starting point without excessively altering the theme palette.
minimum-contrast = 4.5

################################################################################
# Cursor
################################################################################

# Use a bright neutral cursor rather than relying on a red or green accent.
cursor-color = #d3c6aa

# Ensure text underneath the cursor remains clearly visible.
cursor-text = #1e2326

################################################################################
# Selection
################################################################################

# Use neutral, high-contrast selection colors.
#
# Selection must remain visible independently of the syntax color underneath.
selection-foreground = #ffffff
selection-background = #4f5b58

################################################################################
# Accessibility principles
################################################################################

# The terminal theme must not use red and green as the only way to communicate
# state. Applications running inside Ghostty should also use:
#
# - symbols
# - labels
# - text attributes
# - explicit status names
#
# Examples:
#
# 	[OK]		instead of green text only
# 	[ERROR]		instead of red text only
# 	+ / -		in diffs in addition to color
#
# Application-specific palettes for Neovim, tmux and lazygit will be configured
# separately using the same principle.
