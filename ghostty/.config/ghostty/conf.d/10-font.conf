################################################################################
# Font and text rendering
################################################################################

# Primary monospace font.
#
# The Nerd Font variant provides additional glyphs used by Neovim, tmux,
# lazygit and other terminal tools.
font-family = JetBrainsMono Nerd Font Mono

# Default font size in points.
#
# 15 pt provides a practical balance between readability and available screen
# space on a MacBook display.
font-size = 15

################################################################################
# Font features
################################################################################

# Keep programming ligatures enabled.
#
# JetBrains Mono uses contextual alternates for sequences such as:
# 	-> => != >=
#
# Remove or replace this with "-calt" to disable programming ligatures.
font-feature = calt

################################################################################
# Cell metrics
################################################################################

# Use the font's native cell metrics.
#
# Explicit adjustments are intentionally avoided until a concrete rendering
# issue is observed. Incorrect values can cause clipping or uneven alignment.
# adjust-cell-height = 0
# adjust-cell-width = 0

################################################################################
# macOS rendering
################################################################################

# Do not artificially thicken glyph strokes.
#
# JetBrains Mono is already sufficiently readable at the configured size.
# Enabling this can make bold text and Nerd Font symbols appear too heavy.
font-thicken = false
