################################################################################
# Window
################################################################################

# Initial terminal size expressed in character cells.
#
# These values affect newly created windows. macOS may restore the previous
# window size depending on its native window restoration behavior.
window-width = 120
window-height = 36

################################################################################
# Padding
################################################################################

# Add a small amount of space between terminal content and window edges.
#
# The value is intentionally restrained to preserve usable terminal space while
# preventing text from appearing visually attached to the window borders.
window-padding-x = 10
window-padding-y = 8

# Keep padding balanced when the window dimensions do not align perfectly with
# the terminal cell grid.
window-padding-balance = true

################################################################################
# Resizing
################################################################################

# Resize the window freely in pixels rather than snapping its dimensions to the
# terminal cell grid.
#
# This provides behavior closer to a normal macOS application.
window-step-resize = false

################################################################################
# Background
################################################################################

# Keep the terminal background fully opaque.
#
# Transparency can reduce color predictability and text contrast, particularly
# when the content behind the terminal contains bright or strongly colored
# elements.
background-opacity = 1

# Background blur has no effect with a fully opaque background and is disabled
# explicitly to document the intended rendering behavior.
background-blur = false

################################################################################
# Split visibility
################################################################################

# Do not fade unfocused Ghostty splits.
#
# Fading can make low-intensity text harder to read and would conflict with the
# accessibility choices defined in the theme configuration.
unfocused-split-opacity = 1
