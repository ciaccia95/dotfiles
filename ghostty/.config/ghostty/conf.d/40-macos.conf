################################################################################
# macOS integration
################################################################################

################################################################################
# Title bar
################################################################################

# Integrate the native title bar visually with the terminal background.
#
# This keeps the standard macOS window frame and traffic-light controls while
# allowing the theme background color to extend into the title bar.
macos-titlebar-style = transparent

# Hide the current-directory proxy icon from the title bar.
#
# The proxy icon is primarily useful for Finder-style drag-and-drop workflows
# and adds visual noise to a terminal-focused interface.
macos-titlebar-proxy-icon = hidden

# Keep the standard macOS window controls visible.
macos-window-buttons = visible

################################################################################
# Dock and application lifecycle
################################################################################

# Quit Ghostty after the last window is closed.
#
# This differs from the default macOS application behavior, where the
# application remains active in the Dock after its final window is closed.
quit-after-last-window-closed = true

# Keep Ghostty visible in the Dock and application switcher.
macos-hidden = never

# Use the X-ray variant of the Ghostty application icon.
#
# This affects the Dock, application switcher and other runtime application
# icons, but does not replace the icon embedded in the application bundle.
macos-icon = xray

################################################################################
# Window behavior
################################################################################

# Preserve the normal macOS window shadow.
macos-window-shadow = true

# Open files or directories dropped onto the Dock icon in a new tab when a
# Ghostty window already exists.
macos-dock-drop-behavior = new-tab
