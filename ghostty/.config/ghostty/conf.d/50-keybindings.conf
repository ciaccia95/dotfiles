################################################################################
# Keybindings
################################################################################

# Ghostty's default macOS keybindings are intentionally preserved.
#
# Custom bindings should be added only when they solve a concrete workflow
# problem and do not conflict with:
#
# - macOS shortcuts
# - shell key sequences
# - Neovim mappings
# - tmux prefix bindings
#
# Current defaults already provide common actions such as:
#
# - reload configuration
# - create windows and tabs
# - navigate tabs
# - copy and paste
# - adjust font size
# - open the command palette
#
# List the effective bindings with:
#
# 	ghostty +list-keybinds
#
# List only Ghostty's built-in defaults with:
#
# 	ghostty +list-keybinds --default
#
# Custom binding syntax:
#
# 	keybind = modifier+key=action
#
# Example:
#
# 	keybind = cmd+shift+r=reload_config
